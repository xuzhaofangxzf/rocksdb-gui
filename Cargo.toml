[package]
name = "rocksdb-gui"
version = "0.1.0"
edition = "2024"

[package.metadata.bundle]
name = "RocksDB GUI"
identifier = "com.rocksdb.gui"
icon = ["assets/AppIcon.icns"]

[package.metadata.bundle.bin.rocksdb-gui]
name = "RocksDB GUI"
identifier = "com.rocksdb.gui"
icon = ["assets/AppIcon.icns"]

[dependencies]
rocksdb = "0.24.0"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "bc174a7ec4534b2a4174fddde314b38d30d69093", features = [
    "tree-sitter",
] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "bc174a7ec4534b2a4174fddde314b38d30d69093" }
gpui_macros = { git = "https://github.com/zed-industries/zed" }
rfd = "0.17.2"
rust-embed = "8.12.0"
anyhow = "1.0.104"
serde_json = "1.0.151"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
