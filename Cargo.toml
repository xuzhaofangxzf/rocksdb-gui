[package]
name = "rocksdb-gui"
version = "0.1.0"
edition = "2024"

[package.metadata.bundle]
name = "RocksDB GUI"
identifier = "com.rocksdb.gui"
icon = ["assets/rocket.png"]

[package.metadata.bundle.bin.rocksdb-gui]
name = "RocksDB GUI"
identifier = "com.rocksdb.gui"
icon = ["assets/rocket.png"]

[build-dependencies]
ico = "0.4.0"
image = "0.25.9"
winres = "0.1.12"

[dependencies]
rocksdb = "0.24.0"
gpui-kit = { version = "0.8", features = ["tree-sitter"] }
rfd = "0.17.2"
rust-embed = "8.12.0"
anyhow = "1.0.104"
image = "0.25.9"
serde_json = "1.0.151"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[dev-dependencies]
gpui-kit = { version = "0.8", features = ["test-support"] }
